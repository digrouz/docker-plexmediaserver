{{- if and .Values.claimToken.token (not .Values.claimToken.name) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-plexmediaserver-claim
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: plexmediaserver
type: Opaque
stringData:
  {{ .Values.claimToken.key }}: {{ .Values.claimToken.token | quote }}
{{- end }}
