{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}-plexmediaserver
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: plexmediaserver
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: plexmediaserver
{{- end }}
