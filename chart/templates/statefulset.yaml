---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-plexmediaserver
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: plexmediaserver
spec:
  serviceName: {{ .Release.Name }}-headless
  replicas: 1
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app.kubernetes.io/component: plexmediaserver
  template:
    metadata:
      labels:
        app.kubernetes.io/component: plexmediaserver
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: plexmediaserver
          image: {{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 32400
              name: plex-http
              protocol: TCP
            - containerPort: 3005
              name: plex-3005
              protocol: TCP
            - containerPort: 8324
              name: plex-8324
              protocol: TCP
            - containerPort: 32469
              name: plex-32469
              protocol: TCP
            - containerPort: 1900
              name: plex-1900
              protocol: UDP
            - containerPort: 5353
              name: plex-5353
              protocol: UDP
            - containerPort: 32410
              name: plex-32410
              protocol: UDP
            - containerPort: 32411
              name: plex-32411
              protocol: UDP
            - containerPort: 32412
              name: plex-32412
              protocol: UDP
            - containerPort: 32413
              name: plex-32413
              protocol: UDP
            - containerPort: 32414
              name: plex-32414
              protocol: UDP
          volumeMounts:
            - mountPath: /var/lib/plexmediaserver/Library
              name: plex-library
{{- include "helper.extraVolumeMounts" . | nindent 12 }}
          env:
            {{- if .Values.claimToken.name }}
            - name: PLEX_CLAIM
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.claimToken.name }}
                  key: {{ .Values.claimToken.key }}
            {{- else if .Values.claimToken.token }}
            - name: PLEX_CLAIM
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-plexmediaserver-claim
                  key: {{ .Values.claimToken.key }}
            {{- end }}
            - name: GID
              value: "{{ .Values.service.gid }}"
            - name: UID
              value: "{{ .Values.service.uid }}"
            - name: TZ
              value: "{{ .Values.service.tz }}"
            - name: AUTOUPGRADE
              value: "{{ .Values.service.autoupgrade }}"
          {{- if .Values.probes.enabled }}
          livenessProbe:
            tcpSocket:
              port: plex-http
            initialDelaySeconds: {{ .Values.probes.initialDelaySeconds }}
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: plex-http
            initialDelaySeconds: {{ .Values.probes.initialDelaySeconds }}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
  {{- if eq .Values.persistence.library.type "pvc" }}
  volumeClaimTemplates:
    - metadata:
        name: plex-library
      spec:
        accessModes:
          - {{ .Values.persistence.library.pvc.accessMode | quote }}
        resources:
          requests:
            storage: {{ .Values.persistence.library.pvc.size | quote }}
        {{- if .Values.persistence.library.pvc.storageClass }}
        storageClassName: {{ .Values.persistence.library.pvc.storageClass | quote }}
        {{- end }}
  {{- end }}
  {{- if or (ne .Values.persistence.library.type "pvc") .Values.extraVolumes }}
  volumes:
    {{- if ne .Values.persistence.library.type "pvc" }}
    - name: plex-library
      {{- if eq .Values.persistence.library.type "nfs" }}
      nfs:
        server: {{ .Values.persistence.library.nfs.server }}
        path: {{ .Values.persistence.library.nfs.path }}
      {{- else }}
      emptyDir: {}
      {{- end }}
    {{- end }}
{{- include "helper.extraVolumes" . | nindent 4 }}
  {{- end }}
